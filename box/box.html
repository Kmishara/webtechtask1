    <title>Document</title>
    <style>
        .nav-bar{
            background-color: black;
            color: white;
            height: 75px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .main{
            display: flex;
            margin: 30px 10px 85px 10px;
            justify-content: space-evenly;
            align-items: center;
            
        }
        .bike,.car,.auto{
            margin: 10px;
            padding: 5px 30px 30px;
            border: 2px solid black;
            width: 200px;
            border-radius: 15px;
        }
        .bike img, .auto img, .car img{
            transition: all 2s linear;
            width: 200px;
            mix-blend-mode: multiply;
        }

        [type="submit"]{
            padding: 10px 70px;
            background-color: black;
            color: white;
            border-radius: 10px;
            margin-top: 10px;
            font-weight: bolder;
            border: none;
            box-shadow: 0px 5px 22px black;
        }
        [type="text"]{
             padding: 10px 5px;
             font-weight: bold;
             border-radius: 5px;
             /* text-decoration: none; */
             /* border-color: black; */
        }
        .auto img:hover,
        .bike img:hover,
        .car img:hover
        {
            transform: translateX(50px) skew(30deg);
        }
    </style>
</head>
